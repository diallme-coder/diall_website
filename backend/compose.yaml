services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contact_manager
      POSTGRES_USER: contact_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - contact-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_manager -d contact_manager"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://contact_manager:${POSTGRES_PASSWORD:-change-me}@db:5432/contact_manager
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  contact-data:
